# Despliegue en Coolify (Build Pack: Docker Compose).
# Las variables ${...} aparecen en la pestaña «Environment Variables» de Coolify.
# El dominio se asigna en Coolify, en la configuración del servicio «web» (puerto 80).
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # URL pública final, sin barra al final (para canónicas, sitemap y redes sociales)
        SITE_URL: ${SITE_URL:-https://elanth.com}
        # Ruta base: "/" si el sitio vive en la raíz del dominio
        BASE_PATH: ${BASE_PATH:-/}
        # Endpoint que recibe el formulario de asesoría (p. ej. Formspree)
        PUBLIC_FORM_ENDPOINT: ${PUBLIC_FORM_ENDPOINT:-}
    image: elanth-landing:latest
    restart: unless-stopped
    # Puerto interno del contenedor. No ocupa el puerto 80 del VPS: el proxy de Coolify
    # recibe el tráfico del dominio y lo reenvía aquí, aunque otros proyectos usen también el 80.
    expose:
      # - "80"
    # Solo si quieres entrar por IP:puerto sin dominio (p. ej. http://IP-DEL-VPS:8081),
    # descomenta estas líneas y elige un puerto libre del VPS con la variable HOST_PORT:
    # ports:
      - "${HOST_PORT:-8081}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
