<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Elanth · Propuestas de rediseño</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap" rel="stylesheet" />
<style>
  :root {
    --navy: #0b1f33; --navy-deep: #07141f; --slate: #263445; --ink: #1f2a33;
    --paper: #f4f7fa; --ice: #e8f1f6; --sky: #6bbbe0; --blue-ink: #17698f;
    --teal: #19c3b1; --teal-bright: #3fe0cd; --teal-ink: #0b7a6e;
    --amber: #f5a623; --amber-ink: #8a5300; --fog: #9fb3c6; --muted: #52637a;
    --sans: "Archivo", ui-sans-serif, system-ui, sans-serif;
    --mono: "Martian Mono", ui-monospace, monospace;
    --ease: cubic-bezier(0.25, 1, 0.5, 1);
    --expo: cubic-bezier(0.16, 1, 0.3, 1);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--navy); color: var(--paper);
    font-family: var(--sans); font-feature-settings: "ss01";
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  h1, h2, h3, p, ul, ol, figure, fieldset { margin: 0; padding: 0; }
  ul, ol { list-style: none; }
  fieldset { border: 0; min-width: 0; }
  button, input, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; text-align: left; padding: 0; }
  a { color: inherit; text-underline-offset: 0.22em; }
  h1, h2, h3 { text-wrap: balance; }
  p { text-wrap: pretty; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; border-radius: 2px; }
  ::selection { background: var(--teal); color: var(--navy); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .ic { width: 1.25rem; height: 1.25rem; flex-shrink: 0; }

  .wrap { max-width: 90rem; margin: 0 auto; padding: 0 16px; }
  .sec { padding: 96px 0; }
  .ice { background: var(--ice); color: var(--ink); }
  .navy { background: var(--navy); }
  .display { font-size: clamp(2.1rem, 5.6vw, 4rem); font-weight: 820; font-stretch: 118%; letter-spacing: -0.025em; line-height: 0.94; }
  .ice .display { color: var(--navy); }
  .sky { color: var(--sky); }
  .lead { margin-top: 24px; max-width: 40rem; font-size: 1.125rem; line-height: 1.625; }
  .ice .lead { color: var(--muted); }
  .navy .lead { color: var(--fog); max-width: 34rem; }
  .split { display: grid; gap: 48px; margin-top: 64px; }
  .vis-head { display: grid; gap: 24px; }
  .vis-head .lead { margin-top: 0; max-width: 34rem; }
  @media (min-width: 640px) {
    .wrap { padding: 0 32px; }
    .sec { padding: 128px 0; }
  }
  @media (min-width: 1024px) {
    .wrap { padding: 0 48px; }
    .split { grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 40px; margin-top: 80px; }
    .col5 { grid-column: span 5; }
    .col7 { grid-column: span 7; }
    .sticky { position: sticky; top: 8.5rem; }
    .vis-head { grid-template-columns: repeat(12, minmax(0, 1fr)); align-items: end; }
    .vis-head h2 { grid-column: span 7; }
    .vis-head .lead { grid-column: span 5; padding-bottom: 8px; }
  }

  /* Botón principal: el único elemento encendido */
  .btn-lit {
    display: inline-flex; align-items: center; justify-content: center; gap: 0.75rem;
    min-height: 3.5rem; padding: 0 1.25rem; border-radius: 6px;
    background: var(--teal); color: var(--navy); font-weight: 750; text-align: center;
    box-shadow: 0 10px 30px -10px rgb(25 195 177 / 0.55), inset 0 -2px 0 rgb(11 31 51 / 0.18);
    transition: background-color 200ms var(--ease), transform 200ms var(--ease);
  }
  .btn-lit:hover { background: var(--teal-bright); transform: translateY(-1px); }
  .btn-lit .ic { transition: transform 300ms var(--expo); }
  .btn-lit:hover .ic { transform: translateX(3px); }
  @media (min-width: 640px) { .btn-lit { padding: 0 1.5rem; font-stretch: 108%; font-size: 1.0625rem; } }

  /* ---------- Barra de propuestas ---------- */
  .bar {
    position: sticky; top: 0; z-index: 50;
    background: rgb(7 20 31 / 0.94); backdrop-filter: blur(10px);
    border-bottom: 1px solid rgb(255 255 255 / 0.08);
  }
  .bar-in { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 24px; padding-top: 12px; padding-bottom: 12px; }
  .bar-title { font-weight: 700; font-stretch: 110%; font-size: 0.9375rem; }
  .bar-title span { color: var(--fog); font-weight: 500; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; }
  .tab {
    display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px 0 6px;
    border-radius: 999px; border: 1px solid rgb(244 247 250 / 0.2);
    font-size: 0.875rem; font-weight: 600; color: var(--fog); white-space: nowrap;
    transition: background-color 200ms, color 200ms, border-color 200ms;
  }
  .tab b { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: rgb(244 247 250 / 0.1); color: var(--paper); font-size: 0.8125rem; }
  .tab:hover { color: var(--paper); border-color: rgb(244 247 250 / 0.45); }
  .tab[aria-selected="true"] { background: var(--paper); border-color: var(--paper); color: var(--navy); }
  .tab[aria-selected="true"] b { background: var(--navy); color: var(--paper); }

  .intro { background: var(--navy-deep); padding: 56px 0 64px; border-bottom: 1px solid rgb(255 255 255 / 0.06); }
  .intro-k { font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sky); }
  .intro-h { margin-top: 12px; font-size: clamp(2rem, 4.6vw, 3.25rem); font-weight: 820; font-stretch: 118%; letter-spacing: -0.025em; line-height: 1; }
  .intro-p { margin-top: 18px; max-width: 46rem; font-size: 1.125rem; line-height: 1.6; color: var(--fog); }
  .intro-list { margin-top: 28px; display: grid; gap: 12px; max-width: 60rem; }
  .intro-list li { display: grid; grid-template-columns: 1.75rem 1fr; gap: 10px; line-height: 1.55; color: var(--fog); }
  .intro-list b { color: var(--paper); font-weight: 650; }
  .intro-list span:first-child { color: var(--sky); font-weight: 700; font-variant-numeric: tabular-nums; }
  .intro-note { margin-top: 24px; font-size: 0.875rem; color: var(--fog); opacity: 0.8; }
  @media (min-width: 1024px) { .intro-list { grid-template-columns: repeat(3, 1fr); gap: 24px; } }

  .strip { background: var(--navy-deep); color: var(--fog); border-top: 1px solid rgb(255 255 255 / 0.06); }
  .strip p { padding-top: 14px; padding-bottom: 14px; font-family: var(--mono); font-stretch: 82%; font-size: 0.6875rem; letter-spacing: 0.06em; text-transform: uppercase; }
  .strip strong { color: var(--paper); font-weight: 600; }

  [data-proposal][hidden] { display: none; }

  /* ---------- Hoja de ruta (se mantiene igual) ---------- */
  .paper {
    --tear: 7px; position: relative; background: var(--paper); color: var(--ink);
    filter: drop-shadow(0 12px 16px rgb(11 31 51 / 0.14)) drop-shadow(0 1px 2px rgb(11 31 51 / 0.18));
  }
  .paper-torn-bottom {
    -webkit-mask: linear-gradient(#000 0 0) 0 0 / 100% calc(100% - var(--tear)) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(var(--tear) * 2) var(--tear) repeat-x;
    mask: linear-gradient(#000 0 0) 0 0 / 100% calc(100% - var(--tear)) no-repeat, conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / calc(var(--tear) * 2) var(--tear) repeat-x;
  }
  .tear-line { height: 1px; background-image: linear-gradient(to right, currentColor 50%, transparent 50%); background-size: 8px 1px; opacity: 0.45; }
  .slip { padding: 16px 16px 20px; transition: box-shadow 350ms; }
  .slip-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 1px dashed rgb(31 42 51 / 0.3); }
  .slip-title { display: flex; align-items: center; gap: 8px; font-size: 0.875rem; font-weight: 700; font-stretch: 106%; color: var(--navy); }
  .code {
    display: inline-grid; place-items: center; min-width: 2.75rem; height: 1.625rem; padding: 0 0.375rem;
    border: 1px solid var(--ink); border-radius: 2px; flex-shrink: 0;
    font-family: var(--mono); font-stretch: 80%; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.04em; color: var(--ink);
    transition: background-color 350ms, color 350ms, border-color 350ms;
  }
  .flow-nodes { margin-top: 16px; display: flex; flex-direction: column; }
  .node { display: flex; align-items: center; gap: 0.75rem; padding: 0.625rem 0.25rem; transition: opacity 350ms var(--ease); }
  .node strong { display: block; font-size: 0.9375rem; font-weight: 700; font-stretch: 106%; color: var(--navy); line-height: 1.2; }
  .node small { display: block; margin-top: 0.15rem; font-size: 0.8125rem; color: var(--muted); }
  .node-hub { padding: 0.625rem 0.75rem; border-radius: 3px; background: var(--navy); }
  .node-hub strong { color: var(--paper); }
  .node-hub small { color: var(--fog); }
  .node-hub .code { border-color: var(--sky); color: var(--sky); }
  .chip { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.25rem 0.5rem; border-radius: 2px; border: 1px dashed rgb(23 105 143 / 0.6); font-family: var(--mono); font-stretch: 82%; font-size: 0.6875rem; color: var(--blue-ink); white-space: nowrap; transition: background-color 350ms, color 350ms, border-color 350ms; }
  .chip-plain { border-style: solid; border-color: rgb(31 42 51 / 0.25); color: var(--ink); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .wire { display: block; width: 1px; height: 1rem; margin-left: calc(0.25rem + 1.375rem); background-image: linear-gradient(to bottom, var(--ink) 50%, transparent 50%); background-size: 1px 6px; opacity: 0.5; }
  .wire-h { display: none; }
  .row-erp { display: grid; grid-template-columns: 1fr; align-items: center; }
  .node-web { flex-wrap: wrap; }
  .node-web .chip { margin-left: 3.5rem; }
  .cut { margin: 12px 0; display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .cut .tear-line { flex: 1; color: var(--ink); }
  .stub { padding: 16px 16px 24px; }
  @media (min-width: 640px) {
    .slip, .stub { padding-left: 20px; padding-right: 20px; }
    .row-erp { grid-template-columns: 1fr auto 1.3fr; }
    .wire-h { display: block; width: 1rem; height: 1px; background-image: linear-gradient(to right, var(--ink) 50%, transparent 50%); background-size: 6px 1px; opacity: 0.5; }
    .wire-m { display: none; }
    .node-web .chip { margin-left: auto; }
  }
  .flow.has-active .node { opacity: 0.35; }
  .flow.has-active .slip-title { opacity: 0.45; }
  .flow.has-active .node.lit, .flow.has-active .node:has(.lit),
  .flow.has-active [data-node="equipo"].lit .node, .flow.has-active [data-node="equipo"].lit .slip-title { opacity: 1; }
  .flow .node.lit > .code, .flow [data-node="equipo"].lit .slip-title .code, .flow .chip.lit { background: var(--teal); border-color: var(--teal); color: var(--navy); }
  .flow [data-node="equipo"].lit { box-shadow: 0 0 0 2px var(--teal); }

  /* Campos compartidos */
  .choices { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .choice { position: relative; }
  .choice input { position: absolute; inset: 0; width: 1px !important; height: 1px; min-height: 0 !important; margin: 0; padding: 0 !important; border: 0 !important; opacity: 0; pointer-events: none; }
  .choice span { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border-radius: 999px; font-size: 0.9375rem; cursor: pointer; transition: background-color 200ms, border-color 200ms, color 200ms; }
  .choice input:focus-visible + span { outline: 2px solid var(--teal); outline-offset: 2px; }
  input:focus, textarea:focus { outline: none; }
  textarea { resize: vertical; }
  details > summary { list-style: none; }
  details > summary::-webkit-details-marker { display: none; }

  /* =========================================================
     PROPUESTA A · Panel de software
     ========================================================= */
  .a-panel, .a-form {
    background: #fff; color: var(--ink); border-radius: 16px; overflow: hidden;
    border: 1px solid rgb(11 31 51 / 0.08);
    box-shadow: 0 1px 2px rgb(11 31 51 / 0.06), 0 24px 48px -28px rgb(11 31 51 / 0.4);
    max-width: 44rem; margin: 0 auto;
  }
  .a-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 24px 20px 20px; border-bottom: 1px solid rgb(11 31 51 / 0.08); }
  .a-eyebrow { font-size: 0.8125rem; font-weight: 500; color: var(--muted); }
  .a-title { margin-top: 4px; font-size: 1.5rem; font-weight: 800; font-stretch: 116%; letter-spacing: -0.01em; color: var(--navy); line-height: 1.2; }
  .a-head .a-title { margin-top: 0; }
  .a-head .a-eyebrow { margin-top: 4px; }
  .a-pill { display: inline-flex; align-items: center; gap: 6px; min-height: 28px; padding: 0 10px; border-radius: 999px; font-size: 0.8125rem; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
  .a-pill .ic { width: 15px; height: 15px; }
  .a-pill-on { background: rgb(23 105 143 / 0.1); color: var(--blue-ink); }
  .a-pill-wait { background: rgb(245 166 35 / 0.16); color: var(--amber-ink); }
  .a-pill-live { background: rgb(107 187 224 / 0.16); color: var(--sky); }
  .a-list > li + li { border-top: 1px solid rgb(11 31 51 / 0.07); }
  .a-row { position: relative; display: grid; grid-template-columns: 44px 1fr; gap: 16px; width: 100%; padding: 22px 20px; transition: background-color 250ms; }
  .a-row::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 3px; border-radius: 0 3px 3px 0; background: var(--navy); opacity: 0; transition: opacity 250ms; }
  .a-row:hover, .a-row.active { background: #f5f9fc; }
  .a-row.active::before { opacity: 1; }
  .a-ico { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; background: var(--ice); color: var(--navy); transition: background-color 250ms, color 250ms; }
  .a-ico .ic { width: 22px; height: 22px; }
  .a-row:hover .a-ico, .a-row.active .a-ico { background: var(--navy); color: var(--paper); }
  .a-row-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .a-name { font-size: 1.1875rem; font-weight: 760; font-stretch: 110%; letter-spacing: -0.01em; line-height: 1.25; color: var(--navy); }
  .a-code { flex-shrink: 0; padding: 3px 8px; border-radius: 6px; background: var(--ice); font-family: var(--mono); font-stretch: 82%; font-size: 0.6875rem; font-weight: 600; color: var(--muted); }
  .a-text { display: block; margin-top: 8px; font-size: 0.9875rem; line-height: 1.6; color: rgb(31 42 51 / 0.85); }
  .a-result { display: flex; align-items: flex-start; gap: 8px; margin-top: 12px; font-size: 0.9375rem; font-weight: 600; color: var(--blue-ink); }
  .a-result .ic { width: 16px; height: 16px; margin-top: 3px; }
  .a-foot { display: grid; grid-template-columns: 1fr 1fr; background: var(--navy); color: var(--paper); }
  .a-foot > div { padding: 20px; }
  .a-foot > div + div { border-left: 1px solid rgb(255 255 255 / 0.1); }
  .a-foot-k { font-size: 0.8125rem; color: var(--fog); }
  .a-foot-v { margin-top: 4px; font-size: 1.125rem; font-weight: 760; font-stretch: 110%; }

  .a-board { margin-top: 64px; padding: 8px; background: #fff; border-radius: 20px; border: 1px solid rgb(11 31 51 / 0.08); box-shadow: 0 1px 2px rgb(11 31 51 / 0.06), 0 24px 48px -30px rgb(11 31 51 / 0.35); }
  .a-board-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 4px 16px; padding: 12px 14px 16px; font-size: 0.875rem; color: var(--muted); }
  .a-board-head strong { color: var(--navy); font-weight: 750; font-stretch: 110%; }
  .a-tiles { display: grid; gap: 8px; }
  .a-tile { display: flex; flex-direction: column; padding: 24px; border-radius: 14px; background: #f3f8fb; }
  .a-tile-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .a-tile-ico { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 11px; background: #fff; color: var(--navy); }
  .a-tile-name { margin-top: 28px; font-size: 1.375rem; font-weight: 800; font-stretch: 114%; letter-spacing: -0.01em; color: var(--navy); }
  .a-tile-text { margin-top: 8px; font-size: 0.9375rem; line-height: 1.6; color: rgb(31 42 51 / 0.8); }
  .a-tile.is-live { background: var(--navy); }
  .a-tile.is-live .a-tile-ico { background: rgb(255 255 255 / 0.1); color: var(--sky); }
  .a-tile.is-live .a-tile-name { color: var(--paper); }
  .a-tile.is-live .a-tile-text { color: var(--fog); }
  .a-tile-link { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin-top: auto; padding-top: 16px; font-size: 0.9375rem; font-weight: 600; color: var(--sky); text-decoration: underline; text-decoration-color: rgb(107 187 224 / 0.4); }
  .a-tile-link .ic { width: 16px; height: 16px; }

  .a-steps-h, .b-steps-h, .c-steps-h { margin-top: 56px; font-size: 1.25rem; font-weight: 700; font-stretch: 108%; color: var(--paper); }
  .a-steps { margin-top: 20px; display: grid; gap: 24px; }
  .a-steps li { display: grid; grid-template-columns: 2.25rem 1fr; gap: 16px; }
  .a-steps .n { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgb(107 187 224 / 0.4); font-size: 0.875rem; font-weight: 600; color: var(--sky); }
  .a-steps strong, .b-steps strong, .c-steps strong { display: block; font-weight: 600; font-stretch: 104%; color: var(--paper); }
  .a-steps li > span:last-child > span, .b-steps li > span:last-child > span, .c-steps li > span:last-child > span { display: block; margin-top: 4px; color: var(--fog); line-height: 1.55; }

  .a-form { max-width: 42rem; box-shadow: 0 30px 60px -30px rgb(0 0 0 / 0.7); }
  .a-body { padding: 28px 20px 32px; }
  .a-legend { margin-bottom: 16px; font-size: 1rem; font-weight: 700; color: var(--navy); }
  .a-fields, .a-more-body { display: grid; gap: 18px; }
  .f-a label, .f-a .lbl { display: block; margin-bottom: 6px; font-size: 0.875rem; font-weight: 600; color: var(--navy); }
  .f-a .opt { font-weight: 400; color: var(--muted); }
  .f-a input, .f-a textarea { width: 100%; min-height: 48px; padding: 12px 14px; border-radius: 10px; border: 1px solid rgb(31 42 51 / 0.14); background: #f7fafc; font-size: 1rem; color: var(--ink); transition: border-color 200ms, box-shadow 200ms, background-color 200ms; }
  .f-a input::placeholder, .f-a textarea::placeholder { color: var(--muted); }
  .f-a input:hover, .f-a textarea:hover { border-color: rgb(31 42 51 / 0.3); }
  .f-a input:focus, .f-a textarea:focus { background: #fff; border-color: var(--teal-ink); box-shadow: 0 0 0 3px rgb(25 195 177 / 0.28); }
  .choice-a span { border: 1px solid rgb(31 42 51 / 0.18); background: #fff; color: var(--ink); }
  .choice-a input:checked + span { background: var(--navy); border-color: var(--navy); color: var(--paper); }
  .a-more { margin-top: 24px; border: 1px solid rgb(31 42 51 / 0.12); border-radius: 12px; }
  .a-more summary { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 14px 16px; cursor: pointer; border-radius: 12px; }
  .a-more summary:hover { background: #f7fafc; }
  .a-more summary > .ic:first-child { width: 36px; height: 36px; padding: 8px; border-radius: 10px; background: var(--ice); color: var(--navy); }
  .a-more summary strong { display: block; color: var(--navy); font-weight: 700; }
  .a-more summary small { display: block; margin-top: 2px; font-size: 0.8125rem; line-height: 1.45; color: var(--muted); }
  .a-chev { margin-left: auto; color: var(--muted); transition: transform 250ms var(--ease); }
  .a-more[open] .a-chev { transform: rotate(180deg); }
  .a-more-body { padding: 4px 16px 20px; }
  .a-form .btn-lit { width: 100%; margin-top: 28px; }
  .a-note { margin-top: 14px; text-align: center; font-size: 0.875rem; color: var(--muted); }

  @media (min-width: 640px) {
    .a-head { padding: 28px 32px 22px; }
    .a-row { gap: 20px; padding: 24px 32px; }
    .a-foot > div { padding: 22px 32px; }
    .a-tiles { grid-template-columns: repeat(2, 1fr); }
    .a-body { padding: 32px; }
    .a-fields { grid-template-columns: 1fr 1fr; }
  }
  @media (min-width: 1024px) { .a-tiles { grid-template-columns: repeat(4, 1fr); } }

  /* =========================================================
     PROPUESTA B · Editorial
     ========================================================= */
  .b-k { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .b-order { max-width: 46rem; margin: 0 auto; }

      <textarea id="${p}-mensaje" rows="3" placeholder="Ej.: vender en Mercado Libre sin descuadrar el inventario"></textarea>
    </div>`;
  const submit = `<button type="submit" class="btn-lit"><span data-label>Obtener asesoría y demo gratuita</span>${icon('arrow')}</button>`;

  const slip = `
    <figure class="flow" aria-label="Hoja de ruta de tu operación con Elanth">
      <div class="slip paper" data-node="equipo">
        <div class="slip-head">
          <p class="slip-title"><span class="code">OPS</span> Operado por el equipo Elanth</p>
          ${icon('team', 'slip-ic')}
        </div>
        <div class="flow-nodes">
          <div class="node" data-node="anuncios"><span class="code">ADS</span><span><strong>Anuncios y redes</strong><small>Traen clientes a tu tienda</small></span></div>
          <span class="wire"></span>
          <div class="node node-web" data-node="tienda"><span class="code">WEB</span><span><strong>Tu tienda online</strong><small>A la medida de tu negocio</small></span><span class="chip" data-node="b2b"><b>B2B</b> precios por cliente</span></div>
          <span class="wire"></span>
          <div class="row-erp">
            <div class="node" data-node="erp"><span class="code">ERP</span><span><strong>Tu sistema</strong><small>El que ya usas</small></span></div>
            <span class="wire-h"></span><span class="wire wire-m"></span>
            <div class="node node-hub" data-node="panel"><span class="code">SYNC</span><span><strong>Inventario central</strong><small>Un solo panel</small></span></div>
          </div>
          <span class="wire"></span>
          <div class="node" data-node="canales" style="align-items:flex-start"><span class="code">CAN</span><span class="chips">${['Mercado Libre', 'Amazon', 'eBay', 'Marketplace'].map((c) => `<span class="chip chip-plain">${c}</span>`).join('')}</span></div>
        </div>
      </div>
      <div class="cut" aria-hidden="true">${icon('scissors')}<span class="tear-line"></span></div>
      <div class="stub paper paper-torn-bottom">
        <div class="node" data-node="almacen"><span class="code">TÚ</span><span><strong>Tu almacén</strong><small>Recibes el pedido y despachas</small></span></div>
      </div>
    </figure>`;

  const strip = (n, title, note) => `<div class="strip"><p class="wrap">Sección ${n} · <strong>${title}</strong> — ${note}</p></div>`;

  const intro = (letter, name, text, items) => `
    <section class="intro">
      <div class="wrap">
        <p class="intro-k">Propuesta ${letter}</p>
        <h1 class="intro-h">${name}</h1>
        <p class="intro-p">${text}</p>
        <ul class="intro-list">${items.map((t, i) => `<li><span>${i + 1}</span><span>${t}</span></li>`).join('')}</ul>
        <p class="intro-note">El resto de la página (hero, «Llave en mano», footer) y la hoja de ruta de servicios se quedan como están. Pasa el cursor por los servicios para ver cómo se iluminan en la hoja de ruta.</p>
      </div>
    </section>`;

  const servicesSection = (right) => `
    ${strip(1, 'Una sola orden para vender en línea, completa', 'cambia solo la columna «Orden de servicio»')}
    <section class="sec ice" data-svc>
      <div class="wrap">
        <div style="max-width:52rem">
          <h2 class="display">Una sola orden para vender en línea, completa.</h2>
          <p class="lead">E-Commerce 360° es nuestra solución llave en mano: no solo creamos tu tienda, centralizamos y automatizamos todos tus canales de venta para que tus ingresos crezcan sin que crezca tu carga operativa.</p>
        </div>
        <div class="split">
          <div class="col5"><div class="sticky">${slip}</div></div>
          <div class="col7">${right}</div>
        </div>
      </div>
    </section>`;

  const visionSection = (body) => `
    ${strip(2, 'Hoy, comercio electrónico. Mañana, un hub tecnológico', 'sin Elanth Games')}
    <section class="sec ice">
      <div class="wrap">
        <div class="vis-head">
          <h2 class="display">Hoy, comercio electrónico. Mañana, un hub tecnológico.</h2>
          <p class="lead">A medida que crecemos, Elanth se convertirá en un ecosistema de departamentos especializados, listos para resolver cualquier reto de nuestros clientes. Estos son los que vienen.</p>
        </div>
        ${body}
      </div>
    </section>`;

  const contactSection = (stepsHtml, form) => `
    ${strip(3, 'Pide tu asesoría y demo gratuita', 'cambia el formulario y los pasos')}
    <section class="sec navy">
      <div class="wrap split" style="margin-top:0">
        <div class="col5"><div class="sticky">
          <h2 class="display">Pide tu asesoría y <span class="sky">demo gratuita.</span></h2>
          <p class="lead">Déjanos tus datos y te contactamos. Revisamos tu caso y te mostramos cómo se vería tu empresa vendiendo en línea, sin costo.</p>
          ${stepsHtml}
        </div></div>
        <div class="col7">${form}</div>
      </div>
    </section>`;

  const stepsList = (p) => `
    <h3 class="${p}-steps-h">Qué pasa después</h3>
    <ol class="${p}-steps">${steps.map((s, i) => `<li><span class="n">${i + 1}</span><span><strong>${s.title}</strong><span>${s.body}</span></span></li>`).join('')}</ol>`;

  /* =========================================================
     A · Panel de software
     ========================================================= */
  const A = {
    services: `
      <div class="a-panel">
        <div class="a-head">
          <div><p class="a-title">Orden de servicio</p><p class="a-eyebrow">E-Commerce 360° · Llave en mano</p></div>
          <span class="a-pill a-pill-on">${icon('check')} 5 incluidos</span>
        </div>
        <ul class="a-list">${services.map((s) => `
          <li><button type="button" class="a-row" data-service="${s.id}" data-nodes="${s.nodes}">
            <span class="a-ico">${icon(s.icon)}</span>
            <span>
              <span class="a-row-top"><span class="a-name">${s.title}</span><span class="a-code">${s.code}</span></span>
              <span class="a-text">${s.body}</span>
              <span class="a-result">${icon('arrow')}${s.result}</span>
            </span>
          </button></li>`).join('')}
        </ul>
        <div class="a-foot">
          <div><p class="a-foot-k">Tu parte</p><p class="a-foot-v">Recibir y despachar</p></div>
          <div><p class="a-foot-k">Nuestra parte</p><p class="a-foot-v">Todo lo demás</p></div>
        </div>
      </div>`,
    vision: `
      <div class="a-board">
        <div class="a-board-head"><p><strong>Elanth</strong> · Departamentos</p><p>1 en servicio · 3 en preparación</p></div>
        <ul class="a-tiles">${depts.map((d) => `
          <li class="a-tile ${d.live ? 'is-live' : ''}">
            <div class="a-tile-top">
              <span class="a-tile-ico">${icon(d.icon)}</span>
              ${d.live ? `<span class="a-pill a-pill-live">${icon('check')} En servicio</span>` : `<span class="a-pill a-pill-wait">${icon('clock')} En preparación</span>`}
            </div>
            <h3 class="a-tile-name">${d.name}</h3>
            <p class="a-tile-text">${d.body}</p>
            ${d.live ? `<a class="a-tile-link" href="#p-a-form">Pedir asesoría ${icon('arrow')}</a>` : ''}
          </li>`).join('')}
        </ul>
      </div>`,
    form: `
      <form class="a-form" id="p-a-form" data-mock novalidate>
        <div class="a-head">
          <div><p class="a-title">Solicitud de asesoría</p><p class="a-eyebrow">Asesoría y demo · Sin costo</p></div>
          <span class="a-pill a-pill-on">${icon('check')} Sin compromiso</span>
        </div>
        <div class="a-body">
          <fieldset>
            <legend class="a-legend">Tus datos de contacto</legend>
            <div class="a-fields">${required.map((f) => field('a', f)).join('')}</div>
          </fieldset>
          <details class="a-more">
            <summary>${icon('plus')}<span><strong>Cuéntanos de tu negocio</strong><small>Opcional. Si lo llenas, llegamos a la conversación con la tarea adelantada.</small></span>${icon('chev', 'a-chev')}</summary>
            <div class="a-more-body">${optional('a')}</div>
          </details>
          ${submit}
          <p class="a-note">Te contactaremos por WhatsApp o por correo.</p>
        </div>
      </form>`,
  };

  /* =========================================================
     B · Editorial
     ========================================================= */
  const B = {
    services: `
      <div class="b-order">
        <div class="b-order-head"><p class="b-k" style="color:var(--navy)">Orden de servicio</p><p class="b-k">E-Commerce 360° · Llave en mano</p></div>
        <ol class="b-list">${services.map((s, i) => `
          <li><button type="button" class="b-row" data-service="${s.id}" data-nodes="${s.nodes}">
            <span class="b-num">0${i + 1}</span>
            <span>
              <span class="b-name">${s.title}</span>
              <span class="b-text">${s.body}</span>
              <span class="b-result">${icon('arrow')}${s.result}</span>
            </span>
            <span class="b-code">${s.code}</span>
          </button></li>`).join('')}
        </ol>
        <div class="b-split">
          <p><span class="b-k">Tu parte</span><span class="b-big">Recibir y despachar.</span></p>
          <p><span class="b-k">Nuestra parte</span><span class="b-big">Todo lo demás.</span></p>
        </div>
      </div>`,
    vision: `
      <ol class="b-time">${depts.map((d) => `
        <li class="b-step ${d.live ? 'is-live' : ''}">
          <span class="b-dot" aria-hidden="true"></span>
          <p class="b-when">${d.live ? 'Hoy' : 'Próximamente'}</p>
          <h3 class="b-dname">${d.name}</h3>
          <p class="b-dtext">${d.body}</p>
          <p class="b-state">${d.live ? icon('check') + ' En servicio' : icon('clock') + ' En preparación'}</p>
          ${d.live ? `<a class="b-link" href="#p-b-form">Pedir asesoría ${icon('arrow')}</a>` : ''}
        </li>`).join('')}
      </ol>`,
    form: `
      <form class="b-form" id="p-b-form" data-mock novalidate>
        <p class="b-k b-form-k">Tus datos de contacto</p>
        <div class="b-fields">${required.map((f) => field('b', f)).join('')}</div>
        <details class="b-more">
          <summary><span class="b-plus">${icon('plus')}</span><span><strong>Cuéntanos de tu negocio</strong><small>Opcional. Si lo llenas, llegamos con la tarea adelantada.</small></span></summary>
          <div class="b-more-body">${optional('b')}</div>
        </details>
        ${submit}
        <p class="b-note">Te contactaremos por WhatsApp o por correo.</p>
      </form>`,
  };

  /* =========================================================
     C · Circuito
     ========================================================= */
  const cDept = (d, pos) => `
    <div class="c-cell c-${pos} ${d.live ? 'is-live' : ''}">
      <article class="c-dept">
        <div class="c-dept-top"><span class="c-chip">${d.code}</span><span class="c-status">${d.live ? icon('check') + 'En servicio' : icon('clock') + 'En preparación'}</span></div>
        <h3>${d.name}</h3>
        <p>${d.body}</p>
        ${d.live ? `<a class="c-link" href="#p-c-form">Pedir asesoría ${icon('arrow')}</a>` : ''}
      </article>
    </div>`;
  const C = {
    services: `
      <div class="c-board">
        <div class="c-node c-head"><span class="c-pad"></span><span class="c-chip">E360</span><span><strong>Orden de servicio</strong><small>E-Commerce 360° · Llave en mano</small></span></div>
        ${services.map((s) => `
          <div class="c-node c-mod-li"><span class="c-pad"></span>
            <button type="button" class="c-mod" data-service="${s.id}" data-nodes="${s.nodes}">
              <span class="c-mod-top"><span class="c-chip">${s.code}</span><span class="c-name">${s.title}</span></span>
              <span class="c-text">${s.body}</span>
              <span class="c-result">${icon('arrow')}${s.result}</span>
            </button>
          </div>`).join('')}
        <div class="c-node c-term"><span class="c-pad"></span><span class="c-chip c-chip-you">TÚ</span><span><strong>Tu almacén</strong><small>Recibes el pedido y despachas. Nosotros, todo lo demás.</small></span></div>
      </div>`,
    vision: `
      <div class="c-hub">
        ${cDept(depts[0], 'l1')}
        ${cDept(depts[1], 'l2')}
        <div class="c-center">
          <span class="c-rail c-rail-l1 c-flow-v"></span><span class="c-rail c-rail-l2"></span>
          <span class="c-rail c-rail-r1"></span><span class="c-rail c-rail-r2"></span>
          <span class="c-stub c-stub-l c-flow"></span><span class="c-stub c-stub-r"></span>
          <div class="c-core"><img src="${MARK}" alt="" /><span><strong>Elanth</strong><small>HUB TECNOLÓGICO</small></span></div>
        </div>
        ${cDept(depts[2], 'r1')}
        ${cDept(depts[3], 'r2')}
      </div>`,
    form: `
      <form class="c-form" id="p-c-form" data-mock novalidate>
        <div class="c-form-head"><span class="c-chip">ASR</span><span><strong>Solicitud de asesoría</strong><small>Asesoría y demo · Sin costo</small></span></div>
        <div class="c-body">
          <div class="c-fields">${required.map((f) => field('c', f)).join('')}</div>
          <fieldset class="c-opt">
            <legend>OPCIONAL</legend>
            <p class="c-opt-intro"><strong>Cuéntanos de tu negocio</strong>Puedes dejarlo en blanco. Si lo llenas, llegamos a la conversación con la tarea adelantada.</p>
            <div class="c-opt-body">${optional('c')}</div>
          </fieldset>
          ${submit}
          <p class="c-note">Te contactaremos por WhatsApp o por correo.</p>
        </div>
      </form>`,
  };

  /* ---------- Montaje ---------- */
  document.getElementById('p-a').innerHTML =
    intro('A', 'Panel de software',
      'Elanth se presenta como la plataforma que entrega: el contenido vive en paneles blancos de interfaz, con esquinas suaves, íconos y etiquetas de estado. Se siente moderno, ordenado y cercano a un producto digital.',
      ['<b>Orden de servicio:</b> panel con un módulo por servicio, ícono, código y resultado. Abajo, «Tu parte / Nuestra parte» en una franja azul.',
       '<b>Ecosistema:</b> tablero de departamentos con estado. E-Commerce 360° destacado en azul; el resto, «En preparación».',
       '<b>Asesoría:</b> formulario en panel con campos redondeados. La parte opcional queda plegada para que el formulario se vea corto.']) +
    servicesSection(A.services) + visionSection(A.vision) + contactSection(stepsList('a'), A.form);

  document.getElementById('p-b').innerHTML =
    intro('B', 'Editorial',
      'Sin contenedores: la tipografía ancha de la marca, numerales grandes y filetes finos hacen todo el trabajo. Más aire y más elegancia; el contenido respira directamente sobre el fondo.',
      ['<b>Orden de servicio:</b> lista numerada 01–05 separada por filetes. El servicio activo se marca con el numeral en azul y una línea que se dibuja.',
       '<b>Ecosistema:</b> línea de tiempo «Hoy → Próximamente». El tramo de hoy es sólido; lo que viene, punteado.',
       '<b>Asesoría:</b> formulario abierto sobre el azul, con campos subrayados y letra grande. La parte opcional se despliega con un «+».']) +
    servicesSection(B.services) + visionSection(B.vision) + contactSection(stepsList('b'), B.form);

  document.getElementById('p-c').innerHTML =
    intro('C', 'Circuito',
      'Toma el trazo de circuito del logo: cada servicio y cada departamento es un módulo conectado a un mismo bus, sobre una cuadrícula técnica sutil. Refuerza la idea de hub tecnológico.',
      ['<b>Orden de servicio:</b> módulos conectados a un bus que baja hasta «Tu almacén». Al pasar por un servicio, su pista se marca.',
       '<b>Ecosistema:</b> diagrama de hub con Elanth al centro. La conexión de E-Commerce 360° está activa y fluye; las demás, punteadas.',
       '<b>Asesoría:</b> el formulario es un módulo oscuro con pines, y los pasos van conectados por una pista.']) +
    servicesSection(C.services) + visionSection(C.vision) + contactSection(stepsList('c'), C.form);

  /* ---------- Hoja de ruta: iluminar lo que gobierna cada servicio ---------- */
  document.querySelectorAll('[data-svc]').forEach((sec) => {
    const flow = sec.querySelector('.flow');
    const items = [...sec.querySelectorAll('[data-service]')];
    const nodes = [...flow.querySelectorAll('[data-node]')];
    let pinned = null;
    const light = (b) => {
      const ids = b?.dataset.nodes?.split(' ') ?? [];
      flow.classList.toggle('has-active', ids.length > 0);
      nodes.forEach((n) => n.classList.toggle('lit', ids.includes(n.dataset.node)));
      items.forEach((i) => i.classList.toggle('active', i === b));
    };
    items.forEach((b) => {
      b.addEventListener('mouseenter', () => light(b));
      b.addEventListener('focus', () => light(b));
      b.addEventListener('mouseleave', () => light(pinned));
      b.addEventListener('blur', () => light(pinned));
      b.addEventListener('click', () => { pinned = pinned === b ? null : b; light(pinned); });
    });
  });

  /* ---------- Formularios de maqueta ---------- */
  document.querySelectorAll('[data-mock]').forEach((form) => {
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const label = form.querySelector('[data-label]');
      label.textContent = 'Maqueta: el envío está desactivado';
      setTimeout(() => (label.textContent = 'Obtener asesoría y demo gratuita'), 2200);
    });
  });

  /* ---------- Pestañas ---------- */
  const tabs = [...document.querySelectorAll('[data-tab]')];
  const show = (id, scroll) => {
    tabs.forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === id)));
    document.querySelectorAll('[data-proposal]').forEach((p) => (p.hidden = p.dataset.proposal !== id));
    history.replaceState(null, '', '#' + id);
    if (scroll) window.scrollTo({ top: 0 });
  };
  tabs.forEach((t) => t.addEventListener('click', () => show(t.dataset.tab, true)));
  show(['a', 'b', 'c'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'a', false);
</script>
</body>
</html>
